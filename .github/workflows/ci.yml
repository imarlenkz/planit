name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/planit

jobs:
  backend:
    name: Backend · lint & test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - name: System packages (Tesseract kk/ru/en, zbar, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-kaz tesseract-ocr-rus tesseract-ocr-eng libzbar0 fonts-dejavu-core
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (unit + integration)
        env: { OMP_THREAD_LIMIT: "1" }
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-coverage, path: backend/coverage.xml, if-no-files-found: ignore }

  frontend:
    name: Frontend · lint, typecheck & build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: backend, context: backend, target: runtime }
          - { name: frontend, context: frontend, target: runtime }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with: { registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  e2e:
    name: E2E · teacher flow on docker compose
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start stack with demo data
        run: |
          cp .env.example .env
          sed -i 's/^DEMO_AUTORUN=.*/DEMO_AUTORUN=false/' .env
          docker compose up -d --build
          timeout 600 bash -c 'until curl -sf http://localhost/api/health; do sleep 5; done'
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Playwright
        working-directory: frontend
        env: { BASE_URL: "http://localhost" }
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report }

  deploy:
    name: Deploy · ${{ needs.target.outputs.env }}
    needs: [docker, e2e, target]
    if: github.event_name == 'push' && needs.target.outputs.env != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.env }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/planit' }}
          IMAGE_TAG: ${{ needs.target.outputs.tag }}
        run: |
          if [ -z "$SSH_HOST" ]; then echo "DEPLOY_HOST secret is not set for this environment — skipping"; exit 0; fi
          install -m 600 /dev/null key && echo "$SSH_KEY" > key
          scp -i key -o StrictHostKeyChecking=accept-new docker-compose.yml docker-compose.prod.yml deploy/deploy.sh "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
          scp -i key -r nginx "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
          ssh -i key "$SSH_USER@$SSH_HOST" "cd $DEPLOY_PATH && IMAGE_PREFIX=${{ env.IMAGE_PREFIX }} IMAGE_TAG=$IMAGE_TAG sh deploy.sh"

  target:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.t.outputs.env }}
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        run: |
          case "$GITHUB_REF" in
            refs/heads/develop) echo "env=development" >> $GITHUB_OUTPUT; echo "tag=develop" >> $GITHUB_OUTPUT ;;
            refs/heads/main)    echo "env=staging" >> $GITHUB_OUTPUT;     echo "tag=main" >> $GITHUB_OUTPUT ;;
            refs/tags/v*)       echo "env=production" >> $GITHUB_OUTPUT;  echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT ;;
            *)                  echo "env=" >> $GITHUB_OUTPUT ;;
          esac
