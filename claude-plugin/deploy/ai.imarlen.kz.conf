# /etc/nginx/sites-available/ai.imarlen.kz  →  ln -s ... /etc/nginx/sites-enabled/
# Сертификат: certbot --nginx -d ai.imarlen.kz
server {
    listen 80;
    server_name ai.imarlen.kz;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name ai.imarlen.kz;

    ssl_certificate     /etc/letsencrypt/live/ai.imarlen.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.imarlen.kz/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / MCP стримдері үшін буферлеуді өшіреміз
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
