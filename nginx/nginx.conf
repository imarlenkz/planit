# Planit reverse proxy: / → frontend (Next.js), /api → backend (FastAPI), /api/ws → WebSocket progress.
worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  server_tokens off;
  keepalive_timeout 65;

  # scans: up to 150-page PDFs / batches of phone photos
  client_max_body_size 200m;
  client_body_timeout 300s;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  log_format main '$remote_addr - $request_time "$request" $status $body_bytes_sent "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream backend  { server backend:8000; keepalive 16; }
  upstream frontend { server frontend:3000; keepalive 16; }

  server {
    listen 80;
    server_name _;

    # HTTPS: see nginx/prod.conf and docker-compose.prod.yml

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ws/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location /_next/static/ {
      proxy_pass http://frontend;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
